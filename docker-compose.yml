version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: wappay_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: wappay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wappay_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wappay_api
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      API_PREFIX: api/v1
      IS_SIMULATED: "true"
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/wappay?schema=public"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: "docker_super_secure_access_secret_key_12345"
      JWT_REFRESH_SECRET: "docker_super_secure_refresh_secret_key_67890"
      WHATSAPP_PHONE_NUMBER_ID: "mock_phone_id"
      WHATSAPP_ACCESS_TOKEN: "mock_access_token"
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: "mock_verify_token"
      WHATSAPP_APP_SECRET: "mock_app_secret"
      FINANCIAL_PROVIDER: sandbox
      AI_PROVIDER: sandbox
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
